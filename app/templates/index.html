
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM-Enhanced WBLCA</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f6;
      --surface: #ffffff;
      --surface-soft: #eef7f4;
      --ink: #172033;
      --muted: #64748b;
      --line: #d8e2df;
      --teal: #0f766e;
      --teal-dark: #115e59;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --amber: #b45309;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 48px;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: 0;
    }
    .subtitle {
      max-width: 760px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--surface);
      color: var(--teal-dark);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--teal);
    }
    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
      background: var(--surface);
      box-shadow: 0 18px 42px rgba(23, 32, 51, 0.08);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .field {
      margin-top: 14px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 13px;
      font-weight: 800;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      border: 1px dashed #9ab8b2;
      border-radius: 8px;
      padding: 18px;
      background: var(--surface-soft);
      color: var(--ink);
    }
    input[type="file"]::file-selector-button {
      margin-right: 12px;
      border: 0;
      border-radius: 6px;
      padding: 9px 12px;
      background: var(--teal);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 13px 14px;
      color: var(--ink);
      background: #fbfdfc;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-top: 16px;
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.2);
    }
    button:hover {
      background: var(--blue-dark);
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status {
      margin-top: 16px;
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    #materialResult {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 132px;
      white-space: pre-wrap;
      font-family: Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
      background: #f8fafc;
    }
    .note-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }
    .note {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: #ffffff;
      font-size: 12px;
      font-weight: 700;
    }
    @media (max-width: 820px) {
      .hero,
      .tool-grid {
        grid-template-columns: 1fr;
      }
      .hero {
        align-items: start;
      }
      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">openLCA + LLM workflow</p>
        <h1>LLM-Enhanced WBLCA</h1>
        <p class="subtitle">Natural-language material interpretation, openLCA process matching, and fallback GWP estimation for whole-building life cycle assessment.</p>
      </div>
      <div class="status-pill"><span class="status-dot"></span>API ready</div>
    </header>

    <main class="tool-grid">
      <section class="panel">
        <div class="panel-header">
          <h2>BOM Excel</h2>
          <span class="tag">XLSX</span>
        </div>
        <div class="field">
          <label for="fileInput">Spreadsheet file</label>
          <input id="fileInput" type="file" accept=".xlsx">
        </div>
        <button id="uploadButton" type="button">Process BOM and Download Results</button>
        <div id="status" class="status"></div>
        <div class="note-row">
          <span class="note">Excel output</span>
          <span class="note">PNG chart</span>
          <span class="note">kg CO2e</span>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Material Query</h2>
          <span class="tag">TEXT</span>
        </div>
        <div class="field">
          <label for="materialInput">Construction material</label>
          <input id="materialInput" type="text" placeholder="ordinary portland cement">
        </div>
        <button id="materialButton" type="button">Calculate Material GWP</button>
        <div id="materialResult">Result will appear here.</div>
      </section>
    </main>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadButton = document.getElementById("uploadButton");
    const statusBox = document.getElementById("status");
    const materialInput = document.getElementById("materialInput");
    const materialButton = document.getElementById("materialButton");
    const materialResult = document.getElementById("materialResult");

    uploadButton.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        statusBox.textContent = "Select a .xlsx file.";
        return;
      }

      uploadButton.disabled = true;
      statusBox.textContent = "Processing BOM...";

      try {
        const response = await fetch(
          `/calculate_bom_excel?filename=${encodeURIComponent(file.name)}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            },
            body: file
          }
        );

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || `Request failed with status ${response.status}`);
        }

        const blob = await response.blob();
        const downloadUrl = URL.createObjectURL(blob);
        const baseName = file.name.replace(/\.xlsx$/i, "");
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = `${baseName}_gwp_results.zip`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(downloadUrl);
        const responseMessage = response.headers.get("X-Status-Message") || "";
        statusBox.textContent = [
          "Downloaded ZIP with Excel results and PNG chart.",
          responseMessage
        ].filter(Boolean).join(" ");
      } catch (error) {
        statusBox.textContent = error.message;
      } finally {
        uploadButton.disabled = false;
      }
    });

    materialButton.addEventListener("click", async () => {
      const material = materialInput.value.trim();
      if (!material) {
        materialResult.textContent = "Enter a construction material description.";
        return;
      }

      materialButton.disabled = true;
      materialResult.textContent = "Calculating material GWP...";

      try {
        const response = await fetch("/calculate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ input: material })
        });

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.detail || `Request failed with status ${response.status}`);
        }

        const result = await response.json();
        const resultLines = [
          `Input: ${result.input}`,
          `GWP: ${result.kg_co2e_per_kg ?? "N/A"} ${result.unit}`,
          `Source: ${result.source}`,
          `Process: ${result.process_name}`,
          `Impact method: ${result.impact_method ?? "N/A"}`
        ];
        if (result.message) {
          resultLines.push("", result.message);
        }
        materialResult.textContent = resultLines.join("\n");
      } catch (error) {
        materialResult.textContent = error.message;
      } finally {
        materialButton.disabled = false;
      }
    });
  </script>
</body>
</html>
